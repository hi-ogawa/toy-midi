name: PR E2E trace
run-name: "E2E trace for PR #${{ github.event.pull_request.number }} · changed specs"

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: e2e-trace-pr-${{ (github.event.action != 'labeled' || github.event.label.name == 'e2e-trace') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  select:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'e2e-trace') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e-trace')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      sha: ${{ steps.selection.outputs.sha }}
      tests: ${{ steps.selection.outputs.tests }}
    steps:
      - uses: actions/github-script@v9
        id: selection
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            // The files API describes the current PR, so discard an outdated event.
            const { data: current } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pr.number,
            });
            if (current.head.sha !== pr.head.sha) {
              await core.summary.addRaw("Skipped because the PR head changed. The newer push has its own run.").write();
              return;
            }
            // GitHub caps this endpoint at 3,000 files. Do not silently select a partial diff.
            if (files.length >= 3000) {
              throw new Error("PR diff is too large for automatic selection. Use a manual trace run with explicit files.");
            }
            const tests = files
              .filter((file) => file.status !== "removed" && /^e2e\/.*\.spec\.ts$/.test(file.filename))
              .map((file) => file.filename);
            if (tests.length === 0) {
              const marker = "<!-- e2e-trace-label -->";
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const body = [
                marker,
                "### E2E trace · skipped",
                "",
                `Commit: [${pr.head.sha.slice(0, 8)}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${pr.head.sha})`,
                "",
                "No added or modified E2E specs in this PR. Use a manual trace run to choose existing specs.",
                "",
                `[Workflow run](${runUrl})`,
              ].join("\n");
              await core.summary.addRaw(body).write();
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const previous = comments.find((comment) =>
                comment.user?.login === "github-actions[bot]" && comment.body?.startsWith(marker));
              if (previous) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
              }
              return;
            }
            core.setOutput("sha", pr.head.sha);
            core.setOutput("tests", tests.join(" "));

  trace:
    needs: select
    if: needs.select.outputs.tests != ''
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/e2e-trace.yml
    with:
      ref: ${{ github.event.pull_request.head.ref }}
      sha: ${{ needs.select.outputs.sha }}
      tests: ${{ needs.select.outputs.tests }}
      pr-number: ${{ github.event.pull_request.number }}
