name: PR E2E trace
run-name: "E2E trace for PR #${{ github.event.pull_request.number }} · changed specs"

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: e2e-trace-pr-${{ (github.event.action != 'labeled' || github.event.label.name == 'e2e-trace') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  select:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'e2e-trace') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e-trace')
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.selection.outputs.tests }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed specs from the whole PR diff
        id: selection
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tests=$(git diff --name-only --diff-filter=AMR "$BASE_SHA...$HEAD_SHA" -- ':(glob)e2e/**/*.spec.ts' | paste -sd ' ' -)
          printf 'tests=%s\n' "$tests" >> "$GITHUB_OUTPUT"

  report-empty:
    needs: select
    if: needs.select.outputs.tests == ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "### E2E trace · skipped",
              "",
              `Commit: [${pr.head.sha.slice(0, 8)}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${pr.head.sha})`,
              "",
              "No added or modified E2E specs in this PR. Use a manual trace run to choose existing specs.",
              "",
              `[Workflow run](${runUrl})`,
            ].join("\n");
            await core.summary.addRaw(body).write();
            // Read the current description and ignore results for an older PR head.
            const { data: current } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pr.number,
            });
            if (current.state !== "open" || current.head.sha !== pr.head.sha) {
              return;
            }
            const start = "<!-- e2e-trace:start -->";
            const end = "<!-- e2e-trace:end -->";
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${pr.head.sha}`;
            const section = `${start}\nE2E trace · skipped (no changed specs) · [${pr.head.sha.slice(0, 8)}](${commitUrl}) · [run](${runUrl})\n${end}`;
            const description = current.body ?? "";
            const marker = /<!-- e2e-trace:start -->[\s\S]*?<!-- e2e-trace:end -->/;
            await github.rest.pulls.update({
              ...context.repo,
              pull_number: pr.number,
              body: marker.test(description)
                ? description.replace(marker, () => section)
                : `${description}${description ? "\n\n" : ""}${section}`,
            });

  trace:
    needs: select
    if: needs.select.outputs.tests != ''
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/e2e-trace.yml
    with:
      ref: ${{ github.event.pull_request.head.ref }}
      tests: ${{ needs.select.outputs.tests }}
