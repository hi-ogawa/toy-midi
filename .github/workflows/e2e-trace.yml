name: E2E trace
run-name: "E2E trace for ${{ github.event.pull_request.head.ref || inputs.ref }} · ${{ inputs.server || 'build' }} · ${{ inputs.tests || 'changed specs' }}"

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to test
        required: true
        default: main
        type: string
      tests:
        description: Space-separated Playwright file filters (for example e2e/recorder-midi.spec.ts e2e/recorder-mix.spec.ts)
        required: true
        type: string
      server:
        description: App server mode
        default: build
        type: choice
        options:
          - build
          - dev
      grep:
        description: Optional Playwright test-title regex
        default: ".*"
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-trace-${{ (github.event.action != 'labeled' || github.event.label.name == 'e2e-trace') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'e2e-trace') &&
       (github.event.action != 'labeled' || github.event.label.name == 'e2e-trace'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.selection.outputs.sha }}
      ref: ${{ steps.selection.outputs.ref }}
      tests: ${{ steps.selection.outputs.tests }}
    steps:
      - uses: actions/github-script@v9
        id: selection
        env:
          TEST_REF: ${{ inputs.ref }}
          TEST_FILTER: ${{ inputs.tests }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              const { data: branch } = await github.rest.git.getRef({
                ...context.repo,
                ref: `heads/${process.env.TEST_REF}`,
              });
              core.setOutput("sha", branch.object.sha);
              core.setOutput("ref", process.env.TEST_REF);
              core.setOutput("tests", process.env.TEST_FILTER);
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            // The files API describes the current PR, so discard an outdated event.
            const { data: current } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pr.number,
            });
            if (current.head.sha !== pr.head.sha) {
              await core.summary.addRaw("Skipped because the PR head changed. The newer push has its own run.").write();
              return;
            }
            // GitHub caps this endpoint at 3,000 files. Do not silently select a partial diff.
            if (files.length >= 3000) {
              throw new Error("PR diff is too large for automatic selection. Use a manual trace run with explicit files.");
            }
            const tests = files
              .filter((file) => file.status !== "removed" && /^e2e\/.*\.spec\.ts$/.test(file.filename))
              .map((file) => file.filename);
            core.setOutput("sha", pr.head.sha);
            core.setOutput("ref", pr.head.ref);
            core.setOutput("tests", tests.join(" "));

  trace:
    needs: prepare
    if: needs.prepare.outputs.sha != '' && needs.prepare.outputs.tests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-wasm
      - run: pnpm exec playwright install chromium --with-deps --no-shell
      - name: Run selected tests with tracing
        env:
          E2E_TRACE: "1"
          E2E_SERVER: ${{ inputs.server || 'build' }}
          TEST_FILTER: ${{ needs.prepare.outputs.tests }}
          TEST_GREP: ${{ inputs.grep || '.*' }}
        run: |
          read -r -a test_filters <<< "${TEST_FILTER//$'\n'/ }"
          if (( ${#test_filters[@]} == 0 )); then
            echo "::error::Provide at least one test filter."
            exit 1
          fi
          pnpm exec playwright test "${test_filters[@]}" --grep "$TEST_GREP"
      - uses: actions/upload-artifact@v7
        id: upload
        if: always() && hashFiles('test-results/trace-pack.html') != ''
        with:
          path: test-results/trace-pack.html
          archive: false
          retention-days: 7

  # Keep PR write permission isolated from branch-controlled install and test code.
  report:
    needs: [prepare, trace]
    if: ${{ !cancelled() && needs.prepare.outputs.sha != '' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          TEST_REF: ${{ needs.prepare.outputs.ref }}
          TEST_FILTER: ${{ needs.prepare.outputs.tests }}
          TEST_GREP: ${{ inputs.grep || '.*' }}
          TEST_SHA: ${{ needs.prepare.outputs.sha }}
          TEST_RESULT: ${{ needs.trace.result }}
          TEST_SERVER: ${{ inputs.server || 'build' }}
          ARTIFACT_URL: ${{ needs.trace.outputs.artifact-url }}
        with:
          script: |
            const { TEST_REF, TEST_FILTER, TEST_GREP, TEST_SHA, TEST_RESULT, TEST_SERVER, ARTIFACT_URL } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${TEST_SHA}`;
            const escape = (value) => value.replace(/[&<>]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[character]);
            const body = [
              `### E2E trace · ${TEST_RESULT}`,
              "",
              `Branch: <code>${escape(TEST_REF)}</code>`,
              `Commit: [${TEST_SHA.slice(0, 8)}](${commitUrl})`,
              `Server: <code>${escape(TEST_SERVER)}</code>`,
              `Tests: <code>${escape(TEST_FILTER)}</code>`,
              `Title filter: <code>${escape(TEST_GREP)}</code>`,
              "",
              ARTIFACT_URL
                ? `[View E2E trace](${ARTIFACT_URL}) · [Workflow run](${runUrl})`
                : TEST_FILTER
                  ? `No trace pack was produced. [Workflow run](${runUrl})`
                  : `No added or modified E2E specs in this PR. Use a manual trace run to choose existing specs. [Workflow run](${runUrl})`,
            ].join("\n");
            await core.summary.addRaw(body).write();
            const marker = "<!-- e2e-trace-label -->";
            if (context.payload.pull_request) {
              const issue_number = context.payload.pull_request.number;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number,
                per_page: 100,
              });
              const previous = comments.find((comment) =>
                comment.user?.login === "github-actions[bot]" && comment.body?.startsWith(marker));
              const markedBody = `${marker}\n${body}`;
              if (previous) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: previous.id,
                  body: markedBody,
                });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number, body: markedBody });
              }
              return;
            }
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: "open",
              head: `${context.repo.owner}:${TEST_REF}`,
            });
            for (const pr of prs) {
              if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                continue;
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body,
              });
            }
