name: E2E trace
run-name: "E2E trace for ${{ inputs.ref }} · ${{ inputs.server }} · ${{ inputs.tests }}"

on:
  workflow_call:
    inputs:
      ref:
        description: Branch to test
        required: true
        type: string
      tests:
        description: Space-separated Playwright file filters
        required: true
        type: string
      server:
        default: build
        type: string
      grep:
        default: ".*"
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to test
        required: true
        default: main
        type: string
      tests:
        description: Space-separated Playwright file filters (for example e2e/recorder-midi.spec.ts e2e/recorder-mix.spec.ts)
        required: true
        type: string
      server:
        description: App server mode
        default: build
        type: choice
        options:
          - build
          - dev
      grep:
        description: Optional Playwright test-title regex
        default: ".*"
        type: string

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.branch.outputs.sha }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      # Pin the mutable branch ref so the report identifies the tested commit.
      - uses: actions/github-script@v9
        id: branch
        env:
          TEST_REF: ${{ inputs.ref }}
        with:
          script: |
            const { data: branch } = await github.rest.git.getRef({
              ...context.repo,
              ref: `heads/${process.env.TEST_REF}`,
            });
            core.setOutput("sha", branch.object.sha);
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.branch.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-wasm
      - run: pnpm exec playwright install chromium --with-deps --no-shell
      - name: Run selected tests with tracing
        env:
          E2E_TRACE: "1"
          E2E_SERVER: ${{ inputs.server }}
          TEST_FILTER: ${{ inputs.tests }}
          TEST_GREP: ${{ inputs.grep }}
        run: |
          read -r -a test_filters <<< "${TEST_FILTER//$'\n'/ }"
          if (( ${#test_filters[@]} == 0 )); then
            echo "::error::Provide at least one test filter."
            exit 1
          fi
          pnpm exec playwright test "${test_filters[@]}" --grep "$TEST_GREP"
      - uses: actions/upload-artifact@v7
        id: upload
        if: always() && hashFiles('test-results/trace-pack.html') != ''
        with:
          path: test-results/trace-pack.html
          archive: false
          retention-days: 7

  # Keep PR write permission isolated from branch-controlled install and test code.
  report:
    needs: trace
    if: always() && needs.trace.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          TEST_REF: ${{ inputs.ref }}
          TEST_FILTER: ${{ inputs.tests }}
          TEST_GREP: ${{ inputs.grep }}
          TEST_SHA: ${{ needs.trace.outputs.sha }}
          TEST_RESULT: ${{ needs.trace.result }}
          TEST_SERVER: ${{ inputs.server }}
          ARTIFACT_URL: ${{ needs.trace.outputs.artifact-url }}
        with:
          script: |
            const { TEST_REF, TEST_FILTER, TEST_GREP, TEST_SHA, TEST_RESULT, TEST_SERVER, ARTIFACT_URL } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${TEST_SHA}`;
            const escape = (value) => value.replace(/[&<>]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[character]);
            const body = [
              `### E2E trace · ${TEST_RESULT}`,
              "",
              `Branch: <code>${escape(TEST_REF)}</code>`,
              `Commit: [${TEST_SHA.slice(0, 8)}](${commitUrl})`,
              `Server: <code>${escape(TEST_SERVER)}</code>`,
              `Tests: <code>${escape(TEST_FILTER)}</code>`,
              `Title filter: <code>${escape(TEST_GREP)}</code>`,
              "",
              ARTIFACT_URL
                ? `[View E2E trace](${ARTIFACT_URL}) · [Workflow run](${runUrl})`
                : `No trace pack was produced. [Workflow run](${runUrl})`,
            ].join("\n");
            await core.summary.addRaw(body).write();
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: "open",
              head: `${context.repo.owner}:${TEST_REF}`,
            });
            for (const pr of prs) {
              if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                continue;
              }
              // Read the current description and ignore results for an older PR head.
              const { data: current } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pr.number,
              });
              if (current.state !== "open" || current.head.sha !== TEST_SHA) {
                continue;
              }
              const start = "<!-- e2e-trace:start -->";
              const end = "<!-- e2e-trace:end -->";
              const link = ARTIFACT_URL ? `[view artifact](${ARTIFACT_URL})` : "trace unavailable";
              const section = `${start}\n> E2E trace CI: ${link} - [action run](${runUrl}) - commit [\`${TEST_SHA.slice(0, 8)}\`](${commitUrl})\n${end}`;
              const description = current.body ?? "";
              const marker = /<!-- e2e-trace:start -->[\s\S]*?<!-- e2e-trace:end -->/;
              await github.rest.pulls.update({
                ...context.repo,
                pull_number: pr.number,
                body: marker.test(description)
                  ? description.replace(marker, () => section)
                  : `${description}${description ? "\n\n" : ""}${section}`,
              });
            }
