name: E2E trace
run-name: "E2E trace for ${{ inputs.ref }} · ${{ inputs.server }} · ${{ inputs.tests }}"

on:
  workflow_call:
    inputs:
      ref:
        description: Branch name for reporting
        required: true
        type: string
      sha:
        description: Exact commit to test
        required: true
        type: string
      tests:
        description: Space-separated Playwright file filters
        required: true
        type: string
      server:
        default: build
        type: string
      grep:
        default: ".*"
        type: string
      pr-number:
        description: PR whose trace comment should be updated
        default: 0
        type: number
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to test
        required: true
        default: main
        type: string
      tests:
        description: Space-separated Playwright file filters (for example e2e/recorder-midi.spec.ts e2e/recorder-mix.spec.ts)
        required: true
        type: string
      server:
        description: App server mode
        default: build
        type: choice
        options:
          - build
          - dev
      grep:
        description: Optional Playwright test-title regex
        default: ".*"
        type: string

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      # Manual runs resolve the branch once; reusable callers provide a pinned commit.
      - uses: actions/github-script@v9
        id: revision
        env:
          TEST_REF: ${{ inputs.ref }}
          TEST_SHA: ${{ inputs.sha }}
        with:
          script: |
            if (process.env.TEST_SHA) {
              core.setOutput("sha", process.env.TEST_SHA);
              return;
            }
            const { data: branch } = await github.rest.git.getRef({
              ...context.repo,
              ref: `heads/${process.env.TEST_REF}`,
            });
            core.setOutput("sha", branch.object.sha);
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-wasm
      - run: pnpm exec playwright install chromium --with-deps --no-shell
      - name: Run selected tests with tracing
        env:
          E2E_TRACE: "1"
          E2E_SERVER: ${{ inputs.server }}
          TEST_FILTER: ${{ inputs.tests }}
          TEST_GREP: ${{ inputs.grep }}
        run: |
          read -r -a test_filters <<< "${TEST_FILTER//$'\n'/ }"
          if (( ${#test_filters[@]} == 0 )); then
            echo "::error::Provide at least one test filter."
            exit 1
          fi
          pnpm exec playwright test "${test_filters[@]}" --grep "$TEST_GREP"
      - uses: actions/upload-artifact@v7
        id: upload
        if: always() && hashFiles('test-results/trace-pack.html') != ''
        with:
          path: test-results/trace-pack.html
          archive: false
          retention-days: 7

  # Keep PR write permission isolated from branch-controlled install and test code.
  report:
    needs: trace
    if: ${{ !cancelled() && needs.trace.outputs.sha != '' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          TEST_REF: ${{ inputs.ref }}
          TEST_FILTER: ${{ inputs.tests }}
          TEST_GREP: ${{ inputs.grep }}
          TEST_SHA: ${{ needs.trace.outputs.sha }}
          TEST_RESULT: ${{ needs.trace.result }}
          TEST_SERVER: ${{ inputs.server }}
          PR_NUMBER: ${{ inputs.pr-number }}
          ARTIFACT_URL: ${{ needs.trace.outputs.artifact-url }}
        with:
          script: |
            const { TEST_REF, TEST_FILTER, TEST_GREP, TEST_SHA, TEST_RESULT, TEST_SERVER, ARTIFACT_URL } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${TEST_SHA}`;
            const escape = (value) => value.replace(/[&<>]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[character]);
            const body = [
              `### E2E trace · ${TEST_RESULT}`,
              "",
              `Branch: <code>${escape(TEST_REF)}</code>`,
              `Commit: [${TEST_SHA.slice(0, 8)}](${commitUrl})`,
              `Server: <code>${escape(TEST_SERVER)}</code>`,
              `Tests: <code>${escape(TEST_FILTER)}</code>`,
              `Title filter: <code>${escape(TEST_GREP)}</code>`,
              "",
              ARTIFACT_URL
                ? `[View E2E trace](${ARTIFACT_URL}) · [Workflow run](${runUrl})`
                : `No trace pack was produced. [Workflow run](${runUrl})`,
            ].join("\n");
            await core.summary.addRaw(body).write();
            const marker = "<!-- e2e-trace-label -->";
            const issue_number = Number(process.env.PR_NUMBER);
            if (issue_number) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number,
                per_page: 100,
              });
              const previous = comments.find((comment) =>
                comment.user?.login === "github-actions[bot]" && comment.body?.startsWith(marker));
              const markedBody = `${marker}\n${body}`;
              if (previous) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: previous.id,
                  body: markedBody,
                });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number, body: markedBody });
              }
              return;
            }
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: "open",
              head: `${context.repo.owner}:${TEST_REF}`,
            });
            for (const pr of prs) {
              if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                continue;
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body,
              });
            }
