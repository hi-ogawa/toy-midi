name: ci
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - run: corepack enable
      - run: pnpm i
      - run: pnpm build-wasm
      - run: pnpm lint-check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm -C packages/webmcp-bridge build-extension
        env:
          PATCH_MANIFEST: "true"
      - run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - id: upload-extension
        uses: actions/upload-artifact@v7
        with:
          name: webmcp-bridge-extension-${{ github.event.pull_request.number && format('pr{0}-{1}', github.event.pull_request.number, env.SHORT_SHA) || env.SHORT_SHA }}
          path: packages/webmcp-bridge/dist/extension
      - name: Extension artifact
        run: echo "::notice title=Extension artifact::${{ steps.upload-extension.outputs.artifact-url }}"

  e2e:
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - run: corepack enable
      - run: pnpm i
      - run: pnpm build-wasm
      - run: .github/scripts/install-ffmpeg.sh
      - run: pnpm exec playwright install chromium --with-deps --no-shell
      - run: pnpm test-e2e --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
