[project]
name = "toy-midi-bass-pitch-tools"
version = "0.0.0"
description = "Offline grid-guided monophonic bass pitch evaluation tools"
requires-python = ">=3.11,<3.12"
dependencies = [
  "librosa==0.11.0",
  "mido==1.3.3",
  "numpy==2.2.6",
  "scipy==1.16.0",
  "soundfile==0.13.1",
]

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.11"]

[tool.pytest.ini_options]
testpaths = ["tools"]

[tool.ruff]
line-length = 100
target-version = "py311"
