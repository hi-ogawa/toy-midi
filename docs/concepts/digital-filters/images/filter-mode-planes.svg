<title id="title">Exact sampling connects rates to multipliers</title><desc id="desc">Left half of the s-plane is shaded to correspond to the inside of the z-plane unit circle. The example pair sT = -0.3 plus or minus 1.5j maps to z = exp(-0.3) exp(plus or minus 1.5j). The curve below and dots at integer times show the same decaying oscillation.</desc>
