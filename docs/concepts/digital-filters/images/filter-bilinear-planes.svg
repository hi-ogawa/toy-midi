<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-labelledby="title desc">
<title id="title">The bilinear map preserves decay but warps frequency</title><desc id="desc">The left half of the s-plane maps inside the unit circle. Marked imaginary-axis positions 0, plus or minus 2j/T, and infinity map to 1, plus or minus j, and the limiting point -1. Unlike exact sampling, the imaginary axis covers the circle once.</desc>
<rect width="100%" height="100%" fill="#fcfaf5"/>
<style>text{font-family:Arial,sans-serif;fill:#273b37}.title{font-size:23px;font-weight:700}.head{font-size:19px;font-weight:700}.note{font-size:16px}.small{font-size:14px;fill:#52625d}</style>
<text x="32" y="36" class="title" >Bilinear conversion: preserve the regions, change the frequency map</text>
<text x="32" y="66" class="note" >z = (1 + sT/2) / (1 − sT/2)</text>
<text x="245" y="104" class="head" text-anchor="middle">s-plane · rates shown as sT</text>
<text x="750" y="104" class="head" text-anchor="middle">z-plane</text>
<rect x="65" y="120" width="180" height="240" fill="#e0efe9"/>
<rect x="245" y="120" width="180" height="240" fill="#f7e8e0"/>
<line x1="65" y1="240" x2="425" y2="240" stroke="#becbc5" />
<line x1="245" y1="120" x2="245" y2="360" stroke="#24796c" stroke-width="2.5"/>
<text x="429" y="243" class="small" >Re</text>
<text x="163" y="134" class="small" >+j∞</text>
<text x="163" y="354" class="small" >−j∞</text>
<circle cx="245" cy="155" r="5" fill="#426bad" />
<text x="260" y="161" class="note" style="fill:#426bad">2j</text>
<circle cx="245" cy="240" r="5" fill="#c65a32" />
<text x="260" y="246" class="note" style="fill:#c65a32">0</text>
<circle cx="245" cy="325" r="5" fill="#835797" />
<text x="260" y="331" class="note" style="fill:#835797">−2j</text>
<text x="80" y="288" class="small" >left half-plane</text>
<text x="80" y="312" class="small" >decaying modes</text>
<rect x="570" y="120" width="360" height="240" fill="#f7e8e0"/>
<circle cx="750" cy="240" r="106" fill="#e0efe9" stroke="#24796c" stroke-width="2.5"/>
<line x1="570" y1="240" x2="930" y2="240" stroke="#becbc5" />
<line x1="750" y1="120" x2="750" y2="360" stroke="#becbc5" />
<circle cx="856" cy="240" r="5" fill="#c65a32" />
<text x="870" y="264" class="note" style="fill:#c65a32">1</text>
<circle cx="750" cy="134" r="5" fill="#426bad" />
<text x="766" y="143" class="note" style="fill:#426bad">j</text>
<circle cx="750" cy="346" r="5" fill="#835797" />
<text x="766" y="352" class="note" style="fill:#835797">−j</text>
<circle cx="644" cy="240" r="5" fill="#24796c" />
<text x="610" y="264" class="note" style="fill:#24796c">−1</text>
<text x="690" y="281" class="small" >decaying modes</text>
<text x="750" y="389" class="small" text-anchor="middle">Infinite frequency approaches −1</text>
<text x="245" y="389" class="small" text-anchor="middle">Positive Ω runs upward from zero</text>
<line x1="450" y1="240" x2="540" y2="240" stroke="#667c71" />
<path d="M532 235 L540 240 L532 245" fill="none" stroke="#667c71"/>
<text x="32" y="433" class="note" >0 → 1</text>
<text x="240" y="433" class="note" >2j/T → j</text>
<text x="480" y="433" class="note" >−2j/T → −j</text>
<text x="750" y="433" class="note" >±j∞ → −1</text>
<text x="32" y="463" class="note" >The imaginary axis covers the circle once. Analog frequencies crowd near digital Nyquist.</text>
</svg>
