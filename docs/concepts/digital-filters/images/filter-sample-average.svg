<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285" role="img" aria-labelledby="title desc">
<title id="title">Averaging as vector addition</title><desc id="desc">At low frequency, the original and delayed unit phasors are nearly aligned, so their average is nearly as long. At the alternating frequency, the unit phasors point in opposite directions and their average is zero.</desc>
<rect width="100%" height="100%" fill="#fcfaf5"/>
<style>text{font-family:Arial,sans-serif;fill:#273b37}.head{font-size:21px;font-weight:700}.note{font-size:17px}.small{font-size:15px;fill:#52625d}</style>
<line x1="30" y1="25" x2="55" y2="25" stroke="#24796c" stroke-width="4"/>
<text x="64" y="31" class="small" text-anchor="start">original</text>
<line x1="180" y1="25" x2="205" y2="25" stroke="#bd7040" stroke-width="4"/>
<text x="214" y="31" class="small" text-anchor="start">one-sample delay</text>
<line x1="420" y1="25" x2="445" y2="25" stroke="#79569c" stroke-width="4"/>
<text x="454" y="31" class="small" text-anchor="start">average</text>
<text x="970" y="31" class="small" text-anchor="end">(original + delayed) / 2</text>
<line x1="500" y1="55" x2="500" y2="265" stroke="#d8dfd8"/>
<text x="30" y="82" class="head" text-anchor="start">Slow wave: reinforcement</text>
<text x="525" y="82" class="head" text-anchor="start">Alternating wave: cancellation</text>
<line x1="75" y1="162" x2="190.9110991546882" y2="130.9417145876975" stroke="#24796c" stroke-width="4"/>
<polygon points="190.91,130.94 176.80,128.51 179.91,140.10" fill="#24796c"/>
<line x1="75" y1="162" x2="190.9110991546882" y2="193.0582854123025" stroke="#bd7040" stroke-width="4"/>
<polygon points="190.91,193.06 179.91,183.90 176.80,195.49" fill="#bd7040"/>
<text x="130" y="228" class="note" text-anchor="middle">nearly aligned</text>
<text x="249" y="169" class="head" text-anchor="middle">→</text>
<line x1="295" y1="162" x2="410.9110991546882" y2="162" stroke="#79569c" stroke-width="5"/>
<polygon points="410.91,162.00 397.91,156.00 397.91,168.00" fill="#79569c"/>
<text x="355" y="228" class="note" text-anchor="middle">nearly unchanged</text>
<line x1="745" y1="162" x2="865" y2="162" stroke="#24796c" stroke-width="4"/>
<polygon points="865.00,162.00 852.00,156.00 852.00,168.00" fill="#24796c"/>
<line x1="745" y1="162" x2="625" y2="162" stroke="#bd7040" stroke-width="4"/>
<polygon points="625.00,162.00 638.00,168.00 638.00,156.00" fill="#bd7040"/>
<circle cx="745" cy="162" r="6" fill="#79569c"/>
<text x="745" y="132" class="note" text-anchor="middle" style="fill:#79569c">average = 0</text>
<text x="745" y="228" class="note" text-anchor="middle">equal and opposite</text>
<text x="250" y="267" class="small" text-anchor="middle">Small phase difference between adjacent samples</text>
<text x="750" y="267" class="small" text-anchor="middle">Phase difference π between adjacent samples</text>
</svg>
