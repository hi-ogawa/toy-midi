<title id="title">Averaging adjacent samples selects frequencies</title><desc id="desc">Two panels show the current input, its one-sample-delayed copy, and their average on aligned sample indices with the same amplitude scale. A slow cosine is mostly preserved. Alternating plus-one and minus-one samples cancel exactly.</desc>
