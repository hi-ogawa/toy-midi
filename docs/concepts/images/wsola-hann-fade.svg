<svg xmlns="http://www.w3.org/2000/svg" width="760" height="315" viewBox="0 0 760 315" role="img" aria-labelledby="title desc">
<title id="title">The rising half of a Hann window</title>
<desc id="desc">The interpolation weight a(t) equals one half times one minus cos(2 pi t over W). It rises from zero at t equals zero to one at t equals W over two, with horizontal tangents at both endpoints.</desc>
