<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="24" font-weight="bold" font-size="14">The bend range turns the wheel's value into semitones</text>
  <!-- value axis: 0..16384 over x=180..660 -->
  <g stroke="#ddd">
    <line x1="180" y1="44" x2="180" y2="190"/>
    <line x1="300" y1="44" x2="300" y2="190"/>
    <line x1="540" y1="44" x2="540" y2="190"/>
    <line x1="660" y1="44" x2="660" y2="190"/>
  </g>
  <line x1="420" y1="44" x2="420" y2="190" stroke="#999" stroke-dasharray="4 3"/>
  <!-- row 1: message value -->
  <text x="20" y="74">Message value</text>
  <rect x="180" y="60" width="480" height="20" fill="#e8eef8" stroke="#4a6fa5"/>
  <g text-anchor="middle" fill="#333">
    <text x="180" y="97">0</text>
    <text x="300" y="97">4096</text>
    <text x="420" y="97">8192</text>
    <text x="540" y="97">12288</text>
    <text x="660" y="97">16383</text>
  </g>
  <!-- row 2: default range -->
  <text x="20" y="129">Range ±2 (default)</text>
  <line x1="180" y1="124" x2="660" y2="124" stroke="#4a6fa5" stroke-width="2"/>
  <g text-anchor="middle" fill="#333">
    <text x="180" y="143">−2</text>
    <text x="300" y="143">−1</text>
    <text x="420" y="143">0</text>
    <text x="540" y="143">+1</text>
    <text x="660" y="143">+2</text>
  </g>
  <!-- row 3: wide range -->
  <text x="20" y="171">Range ±12</text>
  <line x1="180" y1="166" x2="660" y2="166" stroke="#c0392b" stroke-width="2"/>
  <g text-anchor="middle" fill="#333">
    <text x="180" y="185">−12</text>
    <text x="300" y="185">−6</text>
    <text x="420" y="185">0</text>
    <text x="540" y="185">+6</text>
    <text x="660" y="185">+12</text>
  </g>
  <text x="20" y="220" fill="#555">Set the range with registered parameter 0: controllers 101 = 0 and 100 = 0 select it,</text>
  <text x="20" y="238" fill="#555">then data entry 6 = 12 writes 12 semitones. The same message value then bends six times as far.</text>
</svg>
