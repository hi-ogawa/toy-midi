oke-width="2" stroke-dasharray="6 4" /><text x="736.00" y="87.00" text-anchor="end" font-size="12" fill="#2c6fbb">ℓ(t) = 2f<tspan baseline-shift="sub" font-size="9">0</tspan>t − 1</text><text x="60" y="257" font-size="12" fill="#333">the steps −2 Σ u(t − tₖ), which bring the line down to the sawtooth</text><line x1="60.00" y1="275.00" x2="60.00" y2="363.00" stroke="#e3e3e3" /><line x1="286.67" y1="275.00" x2="286.67" y2="363.00" stroke="#e3e3e3" /><line x1="513.33" y1="275.00" x2="513.33" y2="363.00" stroke="#e3e3e3" /><line x1="740.00" y1="275.00" x2="740.00" y2="363.00" stroke="#e3e3e3" /><text x="54" y="367.00" text-anchor="end" fill="#555" font-size="10">−4</text><text x="54" y="323.00" text-anchor="end" fill="#555" font-size="10">−2</text><text x="54" y="279.00" text-anchor="end" fill="#555" font-size="10">0</text><line x1="60" y1="275.00" x2="740" y2="275.00" stroke="#999" /><line x1="60.00" y1="275.00" x2="286.67" y2="275.00" stroke="#c0392b" stroke-width="2" /><line x1="286.67" y1="275.00" x2="286.67" y2="319.00" stroke="#c0392b" stroke-width="2" /><line x1="286.67" y1="319.00" x2="513.33" y2="319.00" stroke="#c0392b" stroke-width="2" /><line x1="513.33" y1="319.00" x2="513.33" y2="363.00" stroke="#c0392b" stroke-width="2" /><line x1="513.33" y1="363.00" x2="740.00" y2="363.00" stroke="#c0392b" stroke-width="2" /><text x="60.00" y="379.00" text-anchor="middle" fill="#555" font-size="10">0</text><text x="286.67" y="379.00" text-anchor="middle" fill="#555" font-size="10">4</text><text x="286.67" y="393.00" text-anchor="middle" fill="#c0392b" font-size="11">t₁</text><text x="513.33" y="379.00" text-anchor="middle" fill="#555" font-size="10">8</text><text x="513.33" y="393.00" text-anchor="middle" fill="#c0392b" font-size="11">t₂</text><text x="740.00" y="379.00" text-anchor="middle" fill="#555" font-size="10">12</text></svg>
