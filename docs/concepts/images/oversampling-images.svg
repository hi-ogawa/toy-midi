<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="sans-serif"><rect width="100%" height="100%" fill="white"/><text x="10" y="20" font-size="12" ><tspan font-weight='bold' font-size='14'>The 9 kHz sine at 192 kHz: zero-stuffing adds images around 48 and 96 kHz, the low-pass removes them</tspan></text><text x="60" y="50" font-size="12" fill='#333'>zero-stuffed: the sine at ¼ level, plus copies at 48 ± 9 and 96 − 9 kHz</text><line x1="60" x2="740" y1="160" y2="160" stroke="#999"/><text x="54" y="64"  text-anchor='end' fill='#555' font-size='10'>0</text><text x="54" y="76"  text-anchor='end' fill='#555' font-size='10'>-12</text><text x="54" y="114"  text-anchor='end' fill='#555' font-size='10'>-50</text><text x="54" y="164"  text-anchor='end' fill='#555' font-size='10'>-100</text><line x1="230" x2="230" y1="60" y2="160" stroke="#bbb" stroke-dasharray="4 3"/><line x1="123.75" x2="123.75" y1="160" y2="72.04119982652455" stroke="#2c6fbb" stroke-width="3"/><line x1="336.25" x2="336.25" y1="160" y2="72.0411998265246" stroke="#c0392b" stroke-width="3"/><line x1="463.75" x2="463.75" y1="160" y2="72.04119982652445" stroke="#c0392b" stroke-width="3"/><line x1="676.25" x2="676.25" y1="160" y2="72.04119982652453" stroke="#c0392b" stroke-width="3"/><text x="60" y="200" font-size="12" fill='#333'>after the low-pass and ×4: the sine alone, at full level</text><line x1="60" x2="740" y1="310" y2="310" stroke="#999"/><text x="54" y="214"  text-anchor='end' fill='#555' font-size='10'>0</text><text x="54" y="226"  text-anchor='end' fill='#555' font-size='10'>-12</text><text x="54" y="264"  text-anchor='end' fill='#555' font-size='10'>-50</text><text x="54" y="314"  text-anchor='end' fill='#555' font-size='10'>-100</text><line x1="230" x2="230" y1="210" y2="310" stroke="#bbb" stroke-dasharray="4 3"/><line x1="123.75" x2="123.75" y1="310" y2="209.9996639928575" stroke="#2c6fbb" stroke-width="3"/><line x1="336.25" x2="336.25" y1="310" y2="301.4965992904109" stroke="#c0392b" stroke-width="3"/><text x="60" y="316"  text-anchor='middle' fill='#555' font-size='11'>0k</text><text x="230" y="316"  text-anchor='middle' fill='#555' font-size='11'>24k</text><text x="400" y="316"  text-anchor='middle' fill='#555' font-size='11'>48k</text><text x="570" y="316"  text-anchor='middle' fill='#555' font-size='11'>72k</text><text x="740" y="316"  text-anchor='middle' fill='#555' font-size='11'>96k</text><text x="400" y="332" font-size="12" text-anchor='middle'>frequency (Hz) at 192 kHz · dB from the original sine · dashed: the original 24 kHz Nyquist</text></svg>