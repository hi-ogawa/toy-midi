<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
<title id="title">Track shares of the mix</title><desc id="desc">Converted to power shares, the melody is 69% of Clichê's mix and the bass 19%. The countermelody is 2% and hat and ride 0.1%. The shares sum to 103%.</desc>
<rect width="100%" height="100%" fill="#fcfaf5"/>
<style>text{font-family:Arial,sans-serif;fill:#273b37}.title{font-size:22px;font-weight:700}.note{font-size:15px;fill:#52625d}.label{font-size:15px;font-weight:700}.tick{font-size:13px;fill:#52625d}</style>
<text x="32" y="36" class="title" text-anchor="start">A track's difference from the mix is its share of the power</text><text x="32" y="64" class="note" text-anchor="start">Clichê, mix −24.3 LUFS · share = 10^(Δ/10) · shares sum to 103%</text><line x1="260" y1="90" x2="260" y2="340" stroke="#ccd5d0" stroke-dasharray="3 5"/><text x="260" y="362" class="tick" text-anchor="middle">0%</text><line x1="385" y1="90" x2="385" y2="340" stroke="#ccd5d0" stroke-dasharray="3 5"/><text x="385" y="362" class="tick" text-anchor="middle">25%</text><line x1="510" y1="90" x2="510" y2="340" stroke="#ccd5d0" stroke-dasharray="3 5"/><text x="510" y="362" class="tick" text-anchor="middle">50%</text><line x1="635" y1="90" x2="635" y2="340" stroke="#ccd5d0" stroke-dasharray="3 5"/><text x="635" y="362" class="tick" text-anchor="middle">75%</text><line x1="760" y1="90" x2="760" y2="340" stroke="#ccd5d0" stroke-dasharray="3 5"/><text x="760" y="362" class="tick" text-anchor="middle">100%</text><text x="248" y="120" class="note" text-anchor="end">Melody (flute)</text><rect x="260" y="106" width="345.92" height="26" fill="#24796c"/><text x="613.92" y="120" class="tick" text-anchor="start">69% · Δ −1.6 LU</text><text x="248" y="160" class="note" text-anchor="end">Countermelody (tenor sax)</text><rect x="260" y="146" width="11.19" height="26" fill="#526076"/><text x="279.19" y="160" class="tick" text-anchor="start">2% · Δ −16.5 LU</text><text x="248" y="200" class="note" text-anchor="end">Comping (nylon guitar)</text><rect x="260" y="186" width="48.86" height="26" fill="#526076"/><text x="316.86" y="200" class="tick" text-anchor="start">10% · Δ −10.1 LU</text><text x="248" y="240" class="note" text-anchor="end">Bass (acoustic)</text><rect x="260" y="226" width="95.27" height="26" fill="#526076"/><text x="363.27" y="240" class="tick" text-anchor="start">19% · Δ −7.2 LU</text><text x="248" y="280" class="note" text-anchor="end">Drums: kick, stick, brush</text><rect x="260" y="266" width="14.09" height="26" fill="#526076"/><text x="282.09" y="280" class="tick" text-anchor="start">3% · Δ −15.5 LU</text><text x="248" y="320" class="note" text-anchor="end">Drums: hat, ride</text><rect x="260" y="306" width="1.5" height="26" fill="#526076"/><text x="268.33" y="320" class="tick" text-anchor="start">0.1% · Δ −31.8 LU</text>
</svg>
