<title id="title">Areas under the threshold density become candidate weights</title><desc id="desc">The Beta 2,18 density is plotted against threshold, zoomed to zero through 0.4. Equal-width 0.01 strips have different areas. One strip from 0.07 to 0.08 is outlined and labeled w k. Regions below 0.04, from 0.04 to 0.12, and above 0.12 have masses 17.5, 50.8, and 31.7 percent.</desc>
