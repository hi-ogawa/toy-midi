<text x="28" y="30" font-size="19" font-weight="bold">Threshold weight is area under the curve</text>
<text x="28" y="56" fill="#64748b">Beta(2, 18) density b(θ). Each strip spans 0.01 in threshold, as in the implementation.</text>

