<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">Equal steps on three frequency scales</title><desc id="desc">Ten bands between 50 and 8000 Hz shown on the same linear frequency axis. Linear bands have equal widths. Mel bands widen gradually with frequency. Pure logarithmic bands crowd more tightly at the low end.</desc>
<rect width="960" height="300" fill="white"/>
<g font-family="sans-serif" font-size="14" fill="#334155">
<text x="24" y="30" font-size="19" font-weight="bold">Equal steps on a scale give different band boundaries</text>
<text x="24" y="56" fill="#64748b">All three rows use the same linear Hz axis. Each row divides 50–8000 Hz into ten bands.</text>

