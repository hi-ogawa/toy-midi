<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380" role="img" aria-labelledby="title desc">
<title id="title">Pitch and voicing states form a Viterbi lattice across frames</title><desc id="desc">Each pitch bin has voiced and unvoiced states. A restricted example shows two voiced pitch states A and B across three frames, with observation weights inside nodes. Staying has transition weight 0.9 and switching 0.1. The best path stays at A, even though the middle frame favors B.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker></defs>
<rect width="980" height="380" fill="white"/>
<g font-family="sans-serif" font-size="14" fill="#334155">
<text x="24" y="30" font-size="18" font-weight="bold">States in each frame</text>
<text x="24" y="56" fill="#64748b">One voiced/unvoiced pair per pitch bin</text>
<rect x="100" y="86" width="100" height="36" rx="6" fill="#dbeafe" stroke="#94a3b8"/><text x="150" y="110" text-anchor="middle">(A, V)</text>
<rect x="100" y="134" width="100" height="36" rx="6" fill="#dbeafe" stroke="#94a3b8"/><text x="150" y="158" text-anchor="middle">(B, V)</text>
<rect x="100" y="182" width="100" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="150" y="206" text-anchor="middle">(A, U)</text>
<rect x="100" y="230" width="100" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="150" y="254" text-anchor="middle">(B, U)</text>
<text x="24" y="301">One column per frame.</text><text x="24" y="323">The example at right keeps only</text><text x="24" y="345">the two voiced rows, (A, V) and (B, V).</text>
<path d="M325 74V345" stroke="#e2e8f0"/>
<text x="355" y="30" font-size="18" font-weight="bold">Viterbi chooses a path through the lattice</text>
<text x="355" y="56" fill="#64748b">Illustrative restriction to two voiced states; equal initial weights</text>

<path d="M514 147L651 147" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M514 147L651 235" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M514 235L651 147" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M514 235L651 235" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M709 147L846 147" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M709 147L846 235" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M709 235L846 147" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M709 235L846 235" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M485 147H875" stroke="#0f766e" stroke-width="5"/>
<text x="485" y="99" text-anchor="middle">Frame 0</text>
<circle cx="485" cy="147" r="29" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="485" y="152" text-anchor="middle">0.9</text>
<circle cx="485" cy="235" r="29" fill="white" stroke="#94a3b8" stroke-width="2"/><text x="485" y="240" text-anchor="middle">0.1</text>
<text x="680" y="99" text-anchor="middle">Frame 1</text>
<circle cx="680" cy="147" r="29" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="680" y="152" text-anchor="middle">0.4</text>
<circle cx="680" cy="235" r="29" fill="white" stroke="#94a3b8" stroke-width="2"/><text x="680" y="240" text-anchor="middle">0.6</text>
<text x="875" y="99" text-anchor="middle">Frame 2</text>
<circle cx="875" cy="147" r="29" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="875" y="152" text-anchor="middle">0.9</text>
<circle cx="875" cy="235" r="29" fill="white" stroke="#94a3b8" stroke-width="2"/><text x="875" y="240" text-anchor="middle">0.1</text>
<text x="355" y="152">(A, V)</text><text x="355" y="240">(B, V)</text>
<text x="582" y="132" text-anchor="middle" fill="#0f766e">stay: 0.9</text>
<text x="780" y="194" text-anchor="middle">switch: 0.1</text>
<text x="355" y="290">Node numbers = frame evidence. Edges = transition weights.</text>
<text x="355" y="316" fill="#0f766e" font-weight="bold">Best path: A → A → A</text>
<text x="355" y="340">Frame 1 favors B, but switching twice costs more.</text>
</g></svg>