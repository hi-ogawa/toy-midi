<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
<title id="title">Group frame votes by note, then add their weights</title>
<desc id="desc">Illustrative weights from three frames in one region. D1 receives 0.8 plus 0.6, totaling 1.4. D2 receives 0.9. D1 labels the entire region.</desc>
<rect width="900" height="260" fill="white"/>
<g font-family="sans-serif" font-size="15" fill="#334155">
<text x="24" y="32" font-size="18" font-weight="bold">Frames inside one region</text>
<text x="480" y="32" font-size="18" font-weight="bold">Group by note and sum weights</text>
<g fill="#dbeafe" stroke="#2563eb"><rect x="24" y="68" width="110" height="90" rx="6"/><rect x="152" y="68" width="110" height="90" rx="6"/></g>
<rect x="280" y="68" width="110" height="90" rx="6" fill="#ffedd5" stroke="#ea580c"/>
<g text-anchor="middle"><text x="79" y="101" font-weight="bold">D1</text><text x="79" y="133">weight 0.8</text>
<text x="207" y="101" font-weight="bold">D1</text><text x="207" y="133">weight 0.6</text>
<text x="335" y="101" font-weight="bold">D2</text><text x="335" y="133">weight 0.9</text></g>
<path d="M24 177H390m-8-5 8 5-8 5 M409 112H453m-8-5 8 5-8 5" fill="none" stroke="#64748b" stroke-width="2"/>
<text x="207" y="201" text-anchor="middle" fill="#64748b">time</text>
<text x="480" y="93">D1</text><rect x="515" y="68" width="144" height="38" fill="#2563eb"/><rect x="659" y="68" width="108" height="38" fill="#60a5fa" stroke="white"/>
<text x="587" y="93" text-anchor="middle" fill="white">0.8</text><text x="713" y="93" text-anchor="middle" fill="#172554">0.6</text><text x="781" y="93" font-weight="bold">1.4</text>
<text x="480" y="147">D2</text><rect x="515" y="122" width="162" height="38" fill="#fed7aa"/><text x="596" y="147" text-anchor="middle">0.9</text><text x="691" y="147">0.9</text>
<text x="480" y="201" font-weight="bold" fill="#1e40af">Largest total → one D1 note for the region</text>
<text x="24" y="242" fill="#64748b">Illustrative vote weights. Each frame contributes only to its rounded note.</text>
</g></svg>